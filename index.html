<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ApiMira AI</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1014;
  color:#eef5f7;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif
}

.app{
  max-width:900px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column
}

header{
  padding:18px 16px;
  border-bottom:1px solid #263039
}

.logo{
  font-size:22px;
  font-weight:800
}

.sub{
  color:#9daab3;
  font-size:13px;
  margin-top:4px
}

.controls{
  padding:12px 16px;
  border-bottom:1px solid #263039
}

select,button,textarea{
  font:inherit
}

select{
  width:100%;
  background:#121a20;
  color:#fff;
  border:1px solid #3a4852;
  border-radius:12px;
  padding:13px;
  outline:none
}

.filters{
  display:flex;
  gap:8px;
  overflow-x:auto;
  margin-top:10px;
  padding-bottom:2px
}

.filter{
  flex:none;
  border:1px solid #3a4852;
  background:#121a20;
  color:#dce5e9;
  border-radius:20px;
  padding:8px 13px;
  cursor:pointer
}

.filter.active{
  background:#0ea5c6;
  color:#fff;
  border-color:#0ea5c6;
  font-weight:700
}

#chat{
  flex:1;
  padding:18px 16px;
  overflow:auto
}

.msg{
  max-width:85%;
  margin:0 0 12px;
  padding:12px 14px;
  border-radius:16px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.user{
  margin-left:auto;
  background:#123b47
}

.assistant{
  margin-right:auto;
  background:#172127
}

.composer{
  padding:12px 16px;
  border-top:1px solid #263039;
  display:flex;
  gap:10px;
  align-items:end
}

textarea{
  flex:1;
  min-height:52px;
  max-height:180px;
  resize:vertical;
  background:#121a20;
  color:#fff;
  border:1px solid #3a4852;
  border-radius:14px;
  padding:13px;
  outline:none
}

#send{
  border:0;
  background:#0ea5c6;
  color:#fff;
  font-weight:700;
  border-radius:12px;
  padding:14px 18px;
  cursor:pointer
}

.status{
  font-size:12px;
  color:#9aaab3;
  padding:0 16px 8px
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">🤖 ApiMira AI</div>
  <div class="sub">49+ моделей через единый API</div>
</header>

<div class="controls">

<select id="model">
  <option>Загрузка моделей...</option>
</select>

<div class="filters">
  <button class="filter active" data-type="all">Все</button>
  <button class="filter" data-type="chat">🤖 Chat</button>
  <button class="filter" data-type="image">🖼️ Image</button>
  <button class="filter" data-type="code">💻 Code</button>
  <button class="filter" data-type="video">🎬 Video</button>
</div>

</div>

<div id="chat"></div>

<div class="status" id="status">Загрузка моделей...</div>

<div class="composer">

<textarea id="input" placeholder="Напиши сообщение..."></textarea>

<button id="send">Отправить</button>

</div>

</div>

<script>

const chat=document.querySelector("#chat");
const input=document.querySelector("#input");
const model=document.querySelector("#model");
const status=document.querySelector("#status");

let history=[];
let allModels=[];
let currentType="all";

function add(role,text){

  const d=document.createElement("div");

  d.className="msg "+role;
  d.textContent=text;

  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;

  return d;
}

function getType(id){

  const x=id.toLowerCase();

  if(
    x.includes("image") ||
    x.includes("flux") ||
    x.includes("imagen")
  ) return "image";

  if(
    x.includes("video") ||
    x.includes("kling") ||
    x.includes("veo") ||
    x.includes("sora")
  ) return "video";

  if(
    x.includes("codex") ||
    x.includes("code")
  ) return "code";

  return "chat";
}

function renderModels(){

  const selected=model.value;

  model.innerHTML="";

  let filtered=allModels;

  if(currentType!=="all"){
    filtered=allModels.filter(x=>getType(x.id)===currentType);
  }

  filtered.forEach(x=>{

    const option=document.createElement("option");

    option.value=x.id;
    option.textContent=x.id;

    model.appendChild(option);

  });

  if(filtered.some(x=>x.id===selected)){
    model.value=selected;
  }

  status.textContent=
    "Доступно моделей: "+filtered.length+
    " / "+allModels.length;
}

async function loadModels(){

  status.textContent="Загружаю каталог моделей...";

  try{

    const r=await fetch("/api/models");

    if(!r.ok) throw new Error("Ошибка загрузки моделей");

    const j=await r.json();

    allModels=j.data||[];

    if(!allModels.length)
      throw new Error("ApiMira не вернул модели");

    renderModels();

    const preferred=[
      "openai/gpt-5.6-luna",
      "openai/gpt-5.4-mini"
    ];

    for(const p of preferred){

      if(allModels.some(x=>x.id===p)){
        model.value=p;
        break;
      }

    }

  }catch(e){

    status.textContent="Не удалось загрузить модели: "+e.message;

  }
}

async function send(){

  const text=input.value.trim();

  if(!text) return;

  input.value="";

  history.push({
    role:"user",
    content:text
  });

  add("user",text);

  const thinking=add("assistant","Думаю...");
  status.textContent="Запрос отправлен...";

  try{

    const r=await fetch("/api/chat",{

      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        model:model.value,
        messages:history
      })

    });

    const j=await r.json();

    if(!r.ok){

      throw new Error(
        j.error||
        j.message||
        JSON.stringify(j)
      );

    }

    const answer=
      j.choices?.[0]?.message?.content||
      "Пустой ответ";

    thinking.textContent=answer;

    history.push({
      role:"assistant",
      content:answer
    });

    status.textContent="Модель: "+model.value;

  }catch(e){

    thinking.textContent="Ошибка: "+e.message;

    history.pop();

    status.textContent=
      "Проверьте подключение ApiMira";

  }
}

document.querySelectorAll(".filter").forEach(btn=>{

  btn.onclick=()=>{

    document
      .querySelectorAll(".filter")
      .forEach(x=>x.classList.remove("active"));

    btn.classList.add("active");

    currentType=btn.dataset.type;

    renderModels();

  };

});

document.querySelector("#send").onclick=send;

input.addEventListener("keydown",e=>{

  if(
    e.key==="Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();
    send();

  }

});

loadModels();

</script>

</body>
</html>
